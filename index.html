<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b2545">
<meta name="color-scheme" content="light">
<title>Life Recipes V1.2</title>
<style>
:root{--navy:#0b2545;--navy2:#163b67;--ink:#172033;--muted:#6b7280;--line:#dce2ea;--soft:#f5f7fa;--white:#fff;--gold:#a66b00;--danger:#b42318;--green:#176b45;--shadow:0 10px 30px rgba(11,37,69,.13);--safe-top:max(env(safe-area-inset-top),18px);--safe-bottom:max(env(safe-area-inset-bottom),12px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9edf2;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{overscroll-behavior:none}.app{width:min(100%,760px);min-height:100dvh;margin:auto;background:var(--white);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(11,37,69,.08)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:20;padding:var(--safe-top) 14px 10px;background:var(--navy);color:white;display:flex;align-items:center;gap:10px}.brand{font-size:14px;font-weight:900;letter-spacing:.1em;flex:1}.version{font-size:9px;opacity:.65;margin-left:5px}.icon-btn{border:0;background:rgba(255,255,255,.13);color:white;width:38px;height:38px;border-radius:10px;font-size:24px;display:grid;place-items:center}.main{flex:1;padding:10px 12px 86px}.searchrow{display:flex;gap:8px}.search{flex:1;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 11px;font-size:13px;outline:none}.search:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(22,59,103,.1)}.compact-btn{border:1px solid var(--line);background:white;color:var(--navy);border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap}.chiprow{display:flex;gap:6px;overflow:auto;padding:9px 0 7px;scrollbar-width:none}.chiprow::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:white;color:#4b5563;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800;white-space:nowrap}.chip.active{background:var(--navy);border-color:var(--navy);color:white}.subrow{display:flex;align-items:center;margin:0 0 4px}.count{font-size:10px;color:var(--muted);font-weight:700;flex:1}.recipe-list{border-top:1px solid var(--line)}.recipe{position:relative;padding:10px 36px 9px 8px;border-bottom:1px solid var(--line);cursor:pointer;background:white}.recipe:active{background:var(--soft)}.recipe-title{font-size:13px;line-height:1.2;font-weight:900;text-transform:uppercase;letter-spacing:.015em}.favorite-star{color:var(--gold);margin-right:5px}.meta{font-size:9.5px;color:var(--muted);line-height:1.35;margin-top:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-preview{font-size:10px;color:#87909d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px;color:#a3abb6}.empty{padding:58px 18px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:13px;margin-bottom:5px}.empty p{font-size:11px;margin:0 0 14px}.primary{border:0;background:var(--navy);color:white;border-radius:9px;padding:10px 13px;font-size:11px;font-weight:900}.secondary{border:1px solid var(--line);background:white;color:var(--navy);border-radius:9px;padding:9px 12px;font-size:11px;font-weight:900}.danger{color:var(--danger)}.bottomnav{position:fixed;z-index:18;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);padding:7px 12px var(--safe-bottom);background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;backdrop-filter:blur(12px)}.navbtn{border:0;background:transparent;color:var(--muted);padding:7px;font-size:10px;font-weight:900;letter-spacing:.05em}.navbtn.active{color:var(--navy)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,22,40,.48);display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{background:white;width:min(100%,760px);max-height:94dvh;border-radius:18px 18px 0 0;box-shadow:var(--shadow);overflow:auto;padding-bottom:var(--safe-bottom)}.sheet-head{position:sticky;top:0;background:white;z-index:2;display:flex;align-items:center;padding:13px 14px 9px;border-bottom:1px solid var(--line)}.sheet-title{font-size:13px;font-weight:900;letter-spacing:.06em;flex:1;text-transform:uppercase}.close{border:0;background:var(--soft);color:var(--ink);width:32px;height:32px;border-radius:9px;font-size:20px}.sheet-body{padding:12px 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field.full{grid-column:1/-1}.label{display:block;font-size:9px;font-weight:900;letter-spacing:.06em;color:#566174;text-transform:uppercase;margin:0 0 4px}.control{width:100%;border:1px solid var(--line);border-radius:9px;background:white;padding:9px 10px;font-size:12px;color:var(--ink);outline:none}.control:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(22,59,103,.1)}textarea.control{min-height:72px;resize:vertical}.checks{display:flex;gap:14px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:750}.check input{accent-color:var(--navy);width:17px;height:17px}.actions{display:flex;justify-content:flex-end;gap:8px;padding-top:5px}.form-msg{font-size:10px;color:var(--danger);min-height:14px;margin:-3px 0 5px}.detail-title{font-weight:900;text-transform:uppercase;font-size:17px;margin:2px 0 5px}.detail-meta{font-size:10px;color:var(--muted);text-transform:uppercase;line-height:1.5}.detail-block{margin-top:14px}.detail-value{font-size:12px;white-space:pre-wrap;line-height:1.45}.watch{display:block;width:100%;margin:16px 0 12px;text-align:center;text-decoration:none}.menu-actions{display:flex;gap:8px;flex-wrap:wrap}.filter-group{margin-bottom:14px}.filter-label{font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.filter-options{display:flex;gap:6px;flex-wrap:wrap}.settings-title{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.08em;margin:16px 2px 6px}.setting-row{display:flex;align-items:center;border-top:1px solid var(--line);padding:11px 7px;gap:10px}.setting-row:last-child{border-bottom:1px solid var(--line)}.setting-name{flex:1;font-size:12px;font-weight:800}.setting-note{font-size:9px;color:var(--muted);font-weight:500;margin-top:2px}.tag-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tag{display:flex;align-items:center;gap:5px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 7px 5px 9px;font-size:10px}.tag button{border:0;background:transparent;color:var(--danger);padding:0;font-weight:900}.inline-add{display:flex;gap:7px}.toast{position:fixed;z-index:100;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#172033;color:white;padding:9px 13px;border-radius:9px;font-size:11px;font-weight:750;opacity:0;pointer-events:none;transition:.18s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hidden{display:none!important}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88dvh;margin:20px}.bottomnav{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.brand{font-size:13px}.recipe{padding-left:5px}.main{padding-left:10px;padding-right:10px}}

.active-filters{display:flex;align-items:center;gap:7px;background:#eef3f8;border:1px solid #dce2ea;border-radius:8px;padding:6px 8px;margin:0 0 7px;font-size:9px;font-weight:850;color:#0b2545;text-transform:uppercase}.active-filters span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.active-filters button{border:0;background:transparent;color:#0b2545;font-size:17px;line-height:1;padding:0}.url-wrap{display:flex;gap:7px}.url-feedback{min-height:14px;margin-top:4px;font-size:9px;font-weight:800;text-transform:uppercase;color:#176b45}.url-feedback.bad{color:#b42318}.inline-class{display:flex;gap:6px;align-items:center}.inline-class select{flex:1}.mini-add{border:1px solid #dce2ea;background:#fff;color:#0b2545;border-radius:8px;width:34px;height:34px;font-weight:900}.recent-hint{font-size:8.5px;color:#87909d;margin-top:3px;text-transform:uppercase}.status-pills{display:flex;gap:6px;flex-wrap:wrap}.date-meta{font-size:9px;color:#87909d;text-transform:uppercase;margin-top:12px}.default-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.default-grid .field{margin:0}.paste-btn{min-width:58px}

.import-box{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);margin-bottom:10px}.import-title{font-size:12px;font-weight:900;text-transform:uppercase}.import-meta{font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase}.import-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.candidate{display:grid;grid-template-columns:26px 1fr;gap:5px;border-top:1px solid var(--line);padding:8px 2px}.candidate input{width:17px;height:17px;accent-color:var(--navy)}.candidate-title{font-size:11px;font-weight:900;text-transform:uppercase}.candidate-meta{font-size:8.5px;color:var(--muted);text-transform:uppercase;margin-top:2px}.candidate-warn{color:var(--danger);font-weight:850}.candidate-ok{color:var(--green);font-weight:850}.candidate-review{color:#8a5b00;font-weight:850}.candidate select{max-width:145px;padding:5px;font-size:9px}.candidate-fields{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.import-summary{font-size:10px;line-height:1.5;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand">LIFE RECIPES <span class="version">V1.2</span></div><button class="icon-btn" id="addBtn" aria-label="Add recipe">+</button></header>
  <main class="main">
    <section id="recipesView">
      <div class="searchrow"><input id="searchInput" class="search" type="search" placeholder="SEARCH RECIPES..." autocomplete="off"><button id="filterBtn" class="compact-btn">FILTER</button></div>
      <div id="statusChips" class="chiprow"></div><div id="activeFilters" class="active-filters hidden"></div>
      <div class="subrow"><div id="resultCount" class="count"></div><button id="sortBtn" class="compact-btn">SORT: RECENT</button></div>
      <div id="recipeList" class="recipe-list"></div>
    </section>
    <section id="settingsView" class="hidden"></section>
  </main>
  <nav class="bottomnav"><button class="navbtn active" data-view="recipes">RECIPES</button><button class="navbtn" data-view="settings">SETTINGS</button></nav>
</div>
<div id="overlay" class="overlay" role="dialog" aria-modal="true"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>
<input id="restoreInput" type="file" accept="application/json,.json" class="hidden"><input id="playlistInput" type="file" accept="application/json,.json" class="hidden">
<script>
'use strict';
const APP='Life Recipes', VERSION='1.2', SCHEMA=1, DB_NAME='LifeRecipesDB', DB_VERSION=1;
const defaults={cuisines:['South Indian','North Indian','Indo-Chinese','Gujarati','Punjabi','Maharashtrian','Other Indian','International'],meals:['Breakfast','Lunch','Dinner','Snack','Dessert','Drink','Side Dish','Any'],categories:['Dosa & Idli','Rice & Biryani','Curry & Sabzi','Dal','Roti & Paratha','Noodles','Chutney & Pickle','Snacks','Soup','Sweets','Drinks','Baking','Other'],channels:['HomeCookingShow']};
const state={recipes:[],settings:structuredClone(defaults),view:'recipes',search:'',status:'all',filters:{cuisine:'all',meal:'all',category:'all'},sort:'recent',selectedId:null};
let db=null, lastFocus=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function uuid(){return crypto.randomUUID?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function now(){return new Date().toISOString()}
function normaliseRecipe(r={}){return {id:r.id||uuid(),title:String(r.title||'').trim(),sourceType:r.sourceType||'youtube',youtubeUrl:String(r.youtubeUrl||'').trim(),videoId:String(r.videoId||extractVideoId(r.youtubeUrl)||''),channel:String(r.channel||'').trim(),cuisine:String(r.cuisine||''),meal:String(r.meal||''),category:String(r.category||''),isVegetarian:r.isVegetarian??true,isEggless:r.isEggless??true,status:['to_try','tried','regular'].includes(r.status)?r.status:'to_try',favourite:Boolean(r.favourite),notes:String(r.notes||''),sourcePlaylistId:String(r.sourcePlaylistId||''),sourcePlaylistTitle:String(r.sourcePlaylistTitle||''),archived:Boolean(r.archived),createdAt:r.createdAt||now(),updatedAt:r.updatedAt||now()}}
function mergeSettings(s={}){const o={};for(const k of Object.keys(defaults))o[k]=Array.from(new Set([...(Array.isArray(s[k])?s[k]:defaults[k])].map(x=>String(x).trim()).filter(Boolean)));return o}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('recipes')){const st=d.createObjectStore('recipes',{keyPath:'id'});st.createIndex('videoId','videoId',{unique:false});st.createIndex('createdAt','createdAt',{unique:false})}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function getAllRecipes(){return new Promise((res,rej)=>{const r=tx('recipes').getAll();r.onsuccess=()=>res(r.result.map(normaliseRecipe));r.onerror=()=>rej(r.error)})}
function getSettings(){return new Promise((res,rej)=>{const r=tx('settings').get('appSettings');r.onsuccess=()=>res(mergeSettings(r.result||{}));r.onerror=()=>rej(r.error)})}
function putRecipe(recipe){return new Promise((res,rej)=>{const r=tx('recipes','readwrite').put(normaliseRecipe(recipe));r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function removeRecipe(id){return new Promise((res,rej)=>{const r=tx('recipes','readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function saveSettings(){return new Promise((res,rej)=>{const r=tx('settings','readwrite').put({key:'appSettings',...state.settings});r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function replaceAll(data){return new Promise((res,rej)=>{const t=db.transaction(['recipes','settings'],'readwrite'),rs=t.objectStore('recipes'),ss=t.objectStore('settings');rs.clear();for(const r of data.recipes)rs.put(normaliseRecipe(r));ss.put({key:'appSettings',...mergeSettings(data.settings)});t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Restore aborted'))})}
function extractVideoId(value=''){const s=value.trim();if(!s)return '';try{const u=new URL(s.includes('://')?s:'https://'+s);const h=u.hostname.replace(/^www\./,'').toLowerCase();if(h==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';if(h.endsWith('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v')||'';const m=u.pathname.match(/^\/(shorts|embed|live)\/([^/?#]+)/);return m?.[2]||''}}catch{}return ''}
function isValidURL(s){if(!s)return true;try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)}catch{return false}}
function statusText(s){return {to_try:'To Try',tried:'Tried',regular:'Regular'}[s]||'To Try'}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2200)}
function openSheet(html,focusSelector){lastFocus=document.activeElement;$('#sheet').innerHTML=html;$('#overlay').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>{const el=focusSelector?$(focusSelector):$('#sheet button, #sheet input');el?.focus({preventScroll:true})},50)}
function closeSheet(){if($('#overlay').classList.contains('open')){$('#overlay').classList.remove('open');document.body.style.overflow='';lastFocus?.focus?.({preventScroll:true})}}
function sheetFrame(title,body){return `<div class="sheet-head"><div class="sheet-title">${esc(title)}</div><button class="close" data-close aria-label="Close">×</button></div><div class="sheet-body">${body}</div>`}
function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('#recipesView').classList.toggle('hidden',state.view!=='recipes');$('#settingsView').classList.toggle('hidden',state.view!=='settings');if(state.view==='recipes')renderRecipes();else renderSettings()}
function renderStatusChips(){const list=[['all','ALL'],['to_try','TO TRY'],['tried','TRIED'],['regular','REGULAR'],['favourites','★ FAV'],['archived','ARCHIVED']];$('#statusChips').innerHTML=list.map(([v,l])=>`<button class="chip ${state.status===v?'active':''}" data-status="${v}">${l}</button>`).join('')}
function filteredRecipes(){const q=state.search.trim().toLowerCase();let a=state.recipes.filter(r=>{const archivedMatch=state.status==='archived'?r.archived:!r.archived;if(!archivedMatch)return false;if(state.status==='favourites'&&!r.favourite)return false;if(['to_try','tried','regular'].includes(state.status)&&r.status!==state.status)return false;if(state.filters.cuisine!=='all'&&r.cuisine!==state.filters.cuisine)return false;if(state.filters.meal!=='all'&&r.meal!==state.filters.meal)return false;if(state.filters.category!=='all'&&r.category!==state.filters.category)return false;if(q&&!([r.title,r.channel,r.cuisine,r.meal,r.category,r.notes].join(' ').toLowerCase().includes(q)))return false;return true});a.sort((x,y)=>state.sort==='az'?x.title.localeCompare(y.title):state.sort==='category'?(x.category||'').localeCompare(y.category||'')||x.title.localeCompare(y.title):new Date(y.createdAt)-new Date(x.createdAt));return a}
function renderRecipes(){renderStatusChips();$('#searchInput').value=state.search;const active=Object.values(state.filters).filter(v=>v!=='all').length;$('#filterBtn').textContent=active?`FILTER · ${active}`:'FILTER';$('#sortBtn').textContent='SORT: '+({recent:'RECENT',az:'A-Z',category:'CATEGORY'}[state.sort]);const rows=filteredRecipes();$('#resultCount').textContent=`${rows.length} RECIPE${rows.length===1?'':'S'}`;$('#recipeList').innerHTML=rows.length?rows.map(r=>`<article class="recipe" data-id="${esc(r.id)}" tabindex="0"><div class="recipe-title">${r.favourite?'<span class="favorite-star">★</span>':''}${esc(r.title||'Untitled Recipe')}</div><div class="meta">${esc([r.cuisine,r.meal,r.category].filter(Boolean).join(' · ')||'UNCLASSIFIED')}</div><div class="meta">${esc([r.channel,statusText(r.status)].filter(Boolean).join(' · '))}</div>${r.notes?`<div class="note-preview">${esc(r.notes)}</div>`:''}<span class="chev">›</span></article>`).join(''):`<div class="empty"><strong>${state.recipes.length?'NO MATCHING RECIPES':'NO RECIPES YET'}</strong><p>${state.recipes.length?'Try clearing your search or filters.':'Save a YouTube recipe to start your collection.'}</p><button class="primary" id="emptyAdd">+ ADD RECIPE</button></div>`}
function optionList(arr,selected,blank='Unclassified'){return `<option value="">${blank}</option>`+arr.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function showEditor(id=null){const r=id?state.recipes.find(x=>x.id===id):normaliseRecipe({channel:state.settings.channels[0]||''});const body=`<form id="recipeForm"><div class="grid"><div class="field full"><label class="label" for="fUrl">YouTube link</label><input class="control" id="fUrl" name="url" inputmode="url" placeholder="https://youtu.be/..." value="${esc(r.youtubeUrl)}"></div><div class="field full"><label class="label" for="fTitle">Recipe title *</label><input class="control" id="fTitle" name="title" required maxlength="180" value="${esc(r.title)}"></div><div class="field full"><label class="label" for="fChannel">Channel</label><input class="control" id="fChannel" name="channel" list="channelList" maxlength="100" value="${esc(r.channel)}"><datalist id="channelList">${state.settings.channels.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="field"><label class="label">Cuisine</label><select class="control" name="cuisine">${optionList(state.settings.cuisines,r.cuisine)}</select></div><div class="field"><label class="label">Meal</label><select class="control" name="meal">${optionList(state.settings.meals,r.meal)}</select></div><div class="field"><label class="label">Category</label><select class="control" name="category">${optionList(state.settings.categories,r.category)}</select></div><div class="field"><label class="label">Status</label><select class="control" name="status"><option value="to_try" ${r.status==='to_try'?'selected':''}>To Try</option><option value="tried" ${r.status==='tried'?'selected':''}>Tried</option><option value="regular" ${r.status==='regular'?'selected':''}>Regular</option></select></div><div class="field full"><span class="label">Recipe flags</span><div class="checks"><label class="check"><input type="checkbox" name="vegetarian" ${r.isVegetarian?'checked':''}> Vegetarian</label><label class="check"><input type="checkbox" name="eggless" ${r.isEggless?'checked':''}> Eggless</label><label class="check"><input type="checkbox" name="favourite" ${r.favourite?'checked':''}> Favourite</label></div></div><div class="field full"><label class="label" for="fNotes">Notes</label><textarea class="control" id="fNotes" name="notes" maxlength="2000" placeholder="Optional cooking notes...">${esc(r.notes)}</textarea></div></div><div id="formMsg" class="form-msg"></div><div class="actions"><button type="button" class="secondary" data-close>CANCEL</button><button type="submit" class="primary">SAVE RECIPE</button></div></form>`;openSheet(sheetFrame(id?'Edit Recipe':'New Recipe',body),'#fUrl');$('#recipeForm').dataset.id=id||''}

renderSettings=function(){const d=state.settings.captureDefaults;const section=(key,title)=>`<div class="settings-title">${title}</div><div class="setting-row"><div class="setting-name">Manage ${title.toLowerCase()}<div class="setting-note">${state.settings[key].length} values</div></div><button class="compact-btn" data-manage="${key}">MANAGE</button></div>`;$('#settingsView').innerHTML=`<div class="settings-title">NEW RECIPE DEFAULTS</div><div class="setting-row"><div style="width:100%" class="default-grid"><div class="field"><label class="label">Cuisine</label><select class="control" data-default="cuisine">${optionList(state.settings.cuisines,d.cuisine,'None')}</select></div><div class="field"><label class="label">Meal</label><select class="control" data-default="meal">${optionList(state.settings.meals,d.meal,'None')}</select></div><div class="field"><label class="label">Category</label><select class="control" data-default="category">${optionList(state.settings.categories,d.category,'None')}</select></div><div class="field"><label class="label">Status</label><select class="control" data-default="status"><option value="to_try" ${d.status==='to_try'?'selected':''}>To Try</option><option value="tried" ${d.status==='tried'?'selected':''}>Tried</option><option value="regular" ${d.status==='regular'?'selected':''}>Regular</option></select></div><label class="check"><input type="checkbox" data-default="vegetarian" ${d.vegetarian?'checked':''}> Vegetarian</label><label class="check"><input type="checkbox" data-default="eggless" ${d.eggless?'checked':''}> Eggless</label></div></div>${section('cuisines','Cuisines')}${section('meals','Meals')}${section('categories','Recipe categories')}${section('channels','Channels')}<div class="settings-title">IMPORT</div><div class="setting-row"><div class="setting-name">Curated Playlist Import<div class="setting-note">Review YouTube playlist JSON before adding recipes</div></div><button class="compact-btn" id="playlistImportBtn">IMPORT</button></div><div class="settings-title">DATA</div><div class="setting-row"><div class="setting-name">Export backup<div class="setting-note">Recipes, counts and settings as JSON</div></div><button class="compact-btn" id="exportBtn">EXPORT</button></div><div class="setting-row"><div class="setting-name">Restore backup<div class="setting-note">V1.0 and V1.1 backups supported</div></div><button class="compact-btn" id="restoreBtn">RESTORE</button></div><div class="settings-title">ABOUT</div><div class="setting-row"><div class="setting-name">Life Recipes V1.2<div class="setting-note">Curated Playlist Import · Local-first</div></div></div>`};
exportBackup=async function(){const data={app:APP,version:VERSION,schemaVersion:SCHEMA,exportedAt:now(),counts:{recipes:state.recipes.length,cuisines:state.settings.cuisines.length,meals:state.settings.meals.length,categories:state.settings.categories.length,channels:state.settings.channels.length},recipes:state.recipes,settings:state.settings};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a'),date=new Date().toISOString().slice(0,10);a.href=URL.createObjectURL(blob);a.download=`life-recipes-v1.1-backup-${date}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exported')};
function showInlineAdd(key){const labels={cuisines:'Cuisine',meals:'Meal',categories:'Category',channels:'Channel'};openSheet(sheetFrame(`Add ${labels[key]}`,`<form id="inlineAddForm" data-key="${key}"><label class="label">${labels[key]} name</label><input class="control" name="value" maxlength="60" required><div class="actions" style="margin-top:10px"><button type="button" class="secondary" data-return-editor>CANCEL</button><button class="primary">ADD & SELECT</button></div></form>`),'#inlineAddForm input')}
document.addEventListener('input',e=>{if(e.target.id==='fUrl')checkUrlFeedback()});
document.addEventListener('change',async e=>{if(e.target.dataset.default){const k=e.target.dataset.default;state.settings.captureDefaults[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;await saveSettings();toast('Default saved')}});
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='pasteUrl'){try{const text=await navigator.clipboard.readText();$('#fUrl').value=text;checkUrlFeedback();toast('Link pasted')}catch{toast('Clipboard unavailable · use system paste')}}else if(t.id==='clearFilterSummary'){state.filters={cuisine:'all',meal:'all',category:'all'};renderRecipes()}else if(t.dataset.quickStatus){const r=state.recipes.find(x=>x.id===t.dataset.recipe);r.status=t.dataset.quickStatus;r.updatedAt=now();await putRecipe(r);await refresh();showDetail(r.id);toast(`Status: ${statusText(r.status)}`)}else if(t.dataset.inlineAdd){const snapshot=new FormData($('#recipeForm'));sessionStorage.setItem('lifeRecipesDraft',JSON.stringify(Object.fromEntries(snapshot.entries())));sessionStorage.setItem('lifeRecipesDraftChecks',JSON.stringify({vegetarian:$('[name="vegetarian"]').checked,eggless:$('[name="eggless"]').checked,favourite:$('[name="favourite"]').checked,id:$('#recipeForm').dataset.id}));showInlineAdd(t.dataset.inlineAdd)}else if(t.hasAttribute('data-return-editor')){const c=JSON.parse(sessionStorage.getItem('lifeRecipesDraftChecks')||'{}');showEditor(c.id||null)}});
document.addEventListener('submit',async e=>{if(e.target.id!=='inlineAddForm')return;e.preventDefault();e.stopImmediatePropagation();const key=e.target.dataset.key,v=new FormData(e.target).get('value').trim();if(!v)return;if(!state.settings[key].some(x=>x.toLowerCase()===v.toLowerCase()))state.settings[key].push(v);rememberRecent(key,v);await saveSettings();const draft=JSON.parse(sessionStorage.getItem('lifeRecipesDraft')||'{}'),checks=JSON.parse(sessionStorage.getItem('lifeRecipesDraftChecks')||'{}');showEditor(checks.id||null);setTimeout(()=>{for(const [n,val] of Object.entries(draft)){const el=$(`[name="${n}"]`);if(el)el.value=val}const map={cuisines:'cuisine',meals:'meal',categories:'category',channels:'channel'};const el=$(`[name="${map[key]}"]`);if(el)el.value=v;for(const n of ['vegetarian','eggless','favourite']){const x=$(`[name="${n}"]`);if(x)x.checked=!!checks[n]}checkUrlFeedback()},30);toast(`${v} added`)},true);


let importSession=null;
const unsafeWords=/\b(chicken|mutton|lamb|fish|prawn|shrimp|egg|anda|meat|beef|pork)\b/i;
const reviewWords=/\b(cake|brownie|cookie|cookies|biscuit|baking|dessert|pudding|mousse|bread)\b/i;
function canonicalVideoUrl(id){return `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`}
function dietaryState(title){if(unsafeWords.test(title))return 'excluded';if(reviewWords.test(title))return 'review';return 'likely'}
function validatePlaylistData(data){if(!data||data.type!=='life-recipes-playlist'||Number(data.formatVersion)!==1||data.source!=='youtube')throw new Error('Unsupported playlist import format.');if(!String(data.playlistTitle||'').trim())throw new Error('Playlist title is required.');if(!Array.isArray(data.videos))throw new Error('Videos array is missing.');if(data.videos.length>500)throw new Error('Playlist exceeds the 500-video V1.2 safety limit.');const seen=new Set(),videos=[];for(const v of data.videos){const id=String(v.videoId||extractVideoId(v.url)||'').trim(),title=String(v.title||'').trim();if(!id||!title||seen.has(id))continue;seen.add(id);videos.push({videoId:id,title,youtubeUrl:String(v.url||canonicalVideoUrl(id)),channel:String(v.channel||data.channel||'').trim()})}if(!videos.length)throw new Error('No valid playlist videos were found.');return {...data,videos}}
function makeImportSession(data){const existing=new Set(state.recipes.map(r=>r.videoId).filter(Boolean));const d=state.settings.captureDefaults;return {playlistId:String(data.playlistId||''),playlistTitle:data.playlistTitle,channel:String(data.channel||''),defaults:{cuisine:d.cuisine||'',meal:d.meal||'',category:d.category||'',status:d.status||'to_try'},filter:'all',candidates:data.videos.map(v=>{const duplicate=existing.has(v.videoId),diet=dietaryState(v.title);return {...v,duplicate,diet,selected:!duplicate&&diet!=='excluded',cuisine:d.cuisine||'',meal:d.meal||'',category:d.category||'',status:d.status||'to_try',isVegetarian:diet==='likely',isEggless:diet==='likely'}})}}
function importCounts(){const c=importSession.candidates;return {total:c.length,selected:c.filter(x=>x.selected&&!x.duplicate).length,duplicate:c.filter(x=>x.duplicate).length,excluded:c.filter(x=>x.diet==='excluded').length,review:c.filter(x=>x.diet==='review').length}}
function candidateVisible(c){return importSession.filter==='all'||(importSession.filter==='selected'&&c.selected)||(importSession.filter==='review'&&c.diet==='review')||(importSession.filter==='excluded'&&c.diet==='excluded')||(importSession.filter==='duplicates'&&c.duplicate)}
function renderImportReview(){const c=importCounts(),sess=importSession,opt=(arr,val)=>optionList(arr,val);const rows=sess.candidates.filter(candidateVisible).map(x=>`<div class="candidate"><div><input type="checkbox" data-candidate-check="${esc(x.videoId)}" ${x.selected?'checked':''} ${x.duplicate?'disabled':''}></div><div><div class="candidate-title">${esc(x.title)}</div><div class="candidate-meta">${x.duplicate?'<span class="candidate-warn">Already saved</span>':x.diet==='excluded'?'<span class="candidate-warn">Excluded by title</span>':x.diet==='review'?'<span class="candidate-review">Needs review</span>':'<span class="candidate-ok">Likely suitable</span>'} · ${esc(x.channel)}</div><div class="candidate-fields"><select data-candidate-field="cuisine" data-video="${esc(x.videoId)}">${opt(state.settings.cuisines,x.cuisine)}</select><select data-candidate-field="meal" data-video="${esc(x.videoId)}">${opt(state.settings.meals,x.meal)}</select><select data-candidate-field="category" data-video="${esc(x.videoId)}">${opt(state.settings.categories,x.category)}</select></div></div></div>`).join('');const body=`<div class="import-box"><div class="import-title">${esc(sess.playlistTitle)}</div><div class="import-meta">${c.total} videos · ${c.selected} selected · ${c.duplicate} duplicates · ${c.review} review · ${c.excluded} excluded</div></div><div class="grid"><div class="field"><label class="label">Apply cuisine</label><select class="control" id="impCuisine">${opt(state.settings.cuisines,sess.defaults.cuisine)}</select></div><div class="field"><label class="label">Apply meal</label><select class="control" id="impMeal">${opt(state.settings.meals,sess.defaults.meal)}</select></div><div class="field"><label class="label">Apply category</label><select class="control" id="impCategory">${opt(state.settings.categories,sess.defaults.category)}</select></div><div class="field"><label class="label">Status</label><select class="control" id="impStatus"><option value="to_try">To Try</option><option value="tried">Tried</option><option value="regular">Regular</option></select></div></div><div class="import-toolbar"><button class="compact-btn" id="applyImportDefaults">APPLY TO SELECTED</button><button class="compact-btn" id="selectSuitable">SELECT LIKELY</button><button class="compact-btn" id="selectAllImport">SELECT ALL SAFE</button><button class="compact-btn" id="clearImportSelection">CLEAR ALL</button></div><div class="chiprow">${[['all','ALL'],['selected','SELECTED'],['review','REVIEW'],['excluded','EXCLUDED'],['duplicates','DUPLICATES']].map(([v,l])=>`<button class="chip ${sess.filter===v?'active':''}" data-import-filter="${v}">${l}</button>`).join('')}</div><div>${rows||'<div class="empty"><strong>NO CANDIDATES IN THIS VIEW</strong></div>'}</div><div class="actions"><button class="secondary" data-close>CANCEL</button><button class="primary" id="confirmPlaylistImport" ${c.selected?'':'disabled'}>IMPORT ${c.selected}</button></div>`;openSheet(sheetFrame('Review Playlist',body))}
async function loadPlaylistFile(file){try{const data=validatePlaylistData(JSON.parse(await file.text()));importSession=makeImportSession(data);renderImportReview()}catch(e){alert('Playlist import failed: '+e.message)}finally{$('#playlistInput').value=''}}
async function commitPlaylistImport(){const currentIds=new Set(state.recipes.map(r=>r.videoId).filter(Boolean)),chosen=importSession.candidates.filter(c=>c.selected&&!c.duplicate&&!currentIds.has(c.videoId));if(!chosen.length){toast('No new recipes selected');return}const confirmed=confirm(`Import ${chosen.length} new recipes from “${importSession.playlistTitle}”?`);if(!confirmed)return;await new Promise((res,rej)=>{const t=db.transaction('recipes','readwrite'),store=t.objectStore('recipes'),stamp=now();for(const c of chosen)store.add(normaliseRecipe({id:uuid(),title:c.title,sourceType:'youtube',youtubeUrl:c.youtubeUrl,videoId:c.videoId,channel:c.channel||importSession.channel,cuisine:c.cuisine,meal:c.meal,category:c.category,isVegetarian:c.isVegetarian,isEggless:c.isEggless,status:c.status,favourite:false,notes:'',archived:false,sourcePlaylistId:importSession.playlistId,sourcePlaylistTitle:importSession.playlistTitle,createdAt:stamp,updatedAt:stamp}));t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Import aborted'))});const n=chosen.length;await refresh();importSession=null;closeSheet();toast(`${n} recipes imported`)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='playlistImportBtn')$('#playlistInput').click();else if(b.dataset.importFilter){importSession.filter=b.dataset.importFilter;renderImportReview()}else if(b.id==='selectSuitable'){importSession.candidates.forEach(c=>c.selected=!c.duplicate&&c.diet==='likely');renderImportReview()}else if(b.id==='selectAllImport'){importSession.candidates.forEach(c=>c.selected=!c.duplicate&&c.diet!=='excluded');renderImportReview()}else if(b.id==='clearImportSelection'){importSession.candidates.forEach(c=>c.selected=false);renderImportReview()}else if(b.id==='applyImportDefaults'){const vals={cuisine:$('#impCuisine').value,meal:$('#impMeal').value,category:$('#impCategory').value,status:$('#impStatus').value};importSession.defaults=vals;importSession.candidates.filter(c=>c.selected&&!c.duplicate).forEach(c=>Object.assign(c,vals));renderImportReview();toast('Defaults applied')}else if(b.id==='confirmPlaylistImport')await commitPlaylistImport()});
document.addEventListener('change',e=>{if(e.target.dataset.candidateCheck){const c=importSession.candidates.find(x=>x.videoId===e.target.dataset.candidateCheck);c.selected=e.target.checked;renderImportReview()}else if(e.target.dataset.candidateField){const c=importSession.candidates.find(x=>x.videoId===e.target.dataset.video);c[e.target.dataset.candidateField]=e.target.value}});
$('#playlistInput').addEventListener('change',e=>e.target.files[0]&&loadPlaylistFile(e.target.files[0]));

</script>
